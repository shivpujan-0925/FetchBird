services:
  - type: web
    name: fetchbird
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: TEMP_DIR
        value: /app/server/tmp
      - key: CLIENT_DIST_PATH
        value: /app/client/dist
      - key: FILE_TTL_MINUTES
        value: 60
      - key: MAX_CONCURRENT_DOWNLOADS
        value: 2
      - key: MAX_VIDEO_DURATION_SECONDS
        value: 21600
    secretFiles:
      - key: cookies
        name: cookies.txt
        mountPath: /etc/secrets/cookies.txt
